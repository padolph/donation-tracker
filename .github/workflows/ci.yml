name: Node.js CI

# Trigger the workflow on pushes to main, or any Pull Request to main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact-path: dist/*.deb
          - os: macos-latest
            artifact-path: dist/*.dmg
          #- os: windows-latest
          #  artifact-path: dist/*.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Jest Test Suite
      run: npm test

    - name: Build Next.js App
      run: npm run build

    - name: Compile Electron TypeScript
      run: npm run electron:tsc

    - name: Package Desktop Application
      run: npx electron-builder
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload Desktop Installer
      uses: actions/upload-artifact@v4
      with:
        name: desktop-build-${{ matrix.os }}
        path: ${{ matrix.artifact-path }}
        if-no-files-found: error
