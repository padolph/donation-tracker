name: Node.js CI

# Trigger the workflow on pushes to main, or any Pull Request to main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-path: dist/*.deb
          - os: macos-latest
            artifact-path: dist/*.dmg
          - os: windows-latest
            artifact-path: dist/*.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: "file:./prisma/empty.db"

    - name: Run Jest Test Suite
      run: npm test

    - name: Set Next.js Build Environment
      run: |
        echo "NEXT_DISABLE_SWC_MINIFY=true" >> $GITHUB_ENV

    - name: Build Next.js App
      run: npm run build
      env:
        DATABASE_URL: "file:./prisma/empty.db"
        NEXT_PHASE: "phase-production-build"

    - name: Set Production Database URL
      run: |
        echo "PROD_DATABASE_URL=file:$(node -p "require('path').resolve('./prisma/production.db').replace(/\\\\/g, '/')")" >> $GITHUB_ENV

    - name: Create and Seed Default Production Database
      run: |
        npx prisma migrate deploy
        npx prisma db seed
      env:
        DATABASE_URL: ${{ env.PROD_DATABASE_URL }}

    - name: Compile Electron TypeScript
      run: npm run electron:tsc

    - name: Rebuild Native Modules for Electron (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: npx electron-rebuild --arch=x64 --force --build-from-source

    - name: Package Desktop Application (macOS)
      if: matrix.os == 'macos-latest'
      run: npx electron-builder --mac --x64 --arm64
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        # This references GitHub's built-in cryptographic token automatically
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Package Desktop Application (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: npx electron-builder --linux
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        # This references GitHub's built-in cryptographic token automatically
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Package Desktop Application (Windows)
      if: matrix.os == 'windows-latest'
      run: npx electron-builder --win
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
        # This references GitHub's built-in cryptographic token automatically
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Desktop Installer
      uses: actions/upload-artifact@v7
      with:
        name: desktop-build-${{ matrix.os }}
        path: ${{ matrix.artifact-path }}
        if-no-files-found: error

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
