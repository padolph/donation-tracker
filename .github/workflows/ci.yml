name: Node.js CI

# Trigger the workflow on pushes to main, or any Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Jest Test Suite
      run: npm test

    - name: Typecheck Electron Wrapper
        run: npm run electron:tsc

    - name: Verify Desktop Build (Dry Run)
      # Using npx electron-builder --dir directly avoids running 
      # a redundant Next.js build if your previous CI steps already built it
      run: npx electron-builder --dir
