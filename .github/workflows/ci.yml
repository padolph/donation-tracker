name: Node.js CI

# Trigger the workflow on pushes to main, version tags, or any Pull Request to main
on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact-path: dist/*.deb
          - os: macos-latest
            artifact-path: dist/*.dmg
          - os: windows-latest
            artifact-path: dist/*.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Node.js 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci --legacy-peer-deps

    - name: Generate Prisma Client
      run: npx prisma generate
      env:
        DATABASE_URL: "file:./prisma/empty.db"

    - name: Run Jest Test Suite
      run: npm test

    - name: Set Next.js Build Environment
      run: |
        echo "NEXT_DISABLE_SWC_MINIFY=true" >> $GITHUB_ENV

    - name: Build Next.js App
      run: npm run build
      env:
        DATABASE_URL: "file:./prisma/empty.db"
        NEXT_PHASE: "phase-production-build"

    - name: Create and Seed Default Production Database
      run: node scripts/prepare-desktop-db.js

    - name: Compile Electron TypeScript
      run: npm run electron:tsc

    - name: Rebuild Native Modules for Electron (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: npx electron-rebuild --arch=x64 --force --build-from-source

    - name: Package Desktop Application (macOS)
      if: matrix.os == 'macos-latest'
      run: npx electron-builder --mac --x64 --arm64 --publish never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Package Desktop Application (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: npx electron-builder --linux --publish never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Package Desktop Application (Windows)
      if: matrix.os == 'windows-latest'
      run: npx electron-builder --win --publish never
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false

    - name: Upload Desktop Installer
      uses: actions/upload-artifact@v7
      with:
        name: desktop-build-${{ matrix.os }}
        path: ${{ matrix.artifact-path }}
        if-no-files-found: error


  # Each platform builds natively on its own runner. arm64 used to build under
  # QEMU emulation on an amd64 runner, which was slow and sometimes hung (#246).
  build-docker:
    runs-on: ${{ matrix.runner }}
    # PR and main builds fail fast if something hangs. Release (tag) builds
    # keep GitHub's 6 hour maximum because the image is part of the release.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 360 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Pull requests build the image to catch problems early but don't push it.
      # Pushes to main and tags push it by digest; merge-docker tags it.
      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.REGISTRY_IMAGE }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=image,push-by-digest=true,name-canonical=true,push=true' }}
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the per-platform images into one multi-arch image and tags it.
  merge-docker:
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name != 'pull_request'
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 360 || 10 }}
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: Force update 'rolling' tag
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tagName = 'rolling';
            const sha = context.sha;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: sha
              });
            } catch (err) {
              if (err.status === 422) {
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${tagName}`,
                  sha: sha,
                  force: true
                });
              } else {
                throw err;
              }
            }

      - name: Publish Latest Pre-release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rolling
          name: "Rolling Pre-release Build"
          body: |
            Automated rolling pre-release build from the `main` branch.
            
            *Commit: ${{ github.sha }}*
            
            Docker images are available via GitHub Container Registry:
            `docker pull ghcr.io/${{ github.repository }}:latest`
          prerelease: true
          files: |
            release-artifacts/desktop-build-ubuntu-latest/*.deb
            release-artifacts/desktop-build-macos-latest/*.dmg
            release-artifacts/desktop-build-windows-latest/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          body: |
            Official release ${{ github.ref_name }}.
            
            Docker images are available via GitHub Container Registry:
            `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
          prerelease: false
          files: |
            release-artifacts/desktop-build-ubuntu-latest/*.deb
            release-artifacts/desktop-build-macos-latest/*.dmg
            release-artifacts/desktop-build-windows-latest/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

