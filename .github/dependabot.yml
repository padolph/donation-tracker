version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Group all NPM updates into a single PR
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # Force Dependabot to respect our v5 LTS rule
    ignore:
      - dependency-name: "prisma"
        versions: [">= 6.0.0"]
      - dependency-name: "@prisma/client"
        versions: [">= 6.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
